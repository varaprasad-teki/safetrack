<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafeTrack Login</title>
  <link rel="stylesheet" href="login.css" />
  <style>
    .login-card {
      max-width: 420px;
      margin: 40px auto;
      padding: 30px 25px;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 12px 30px rgba(0,0,0,0.12);
    }
    body {
      background: linear-gradient(135deg, #0f172a, #1d4ed8);
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .login-card h1, .login-card p {
      text-align: center;
      color: #111827;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      margin: 10px 0;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px 14px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    #submitBtn { background: #22c55e; color: white; }
    #verifyOtpBtn { background: #2563eb; color: white; }
    #allowBtn { background: #f59e0b; color: white; }
    .links {
      display: flex;
      justify-content: space-between;
      margin-top: 14px;
      font-size: 14px;
    }
    .links a {
      color: #1d4ed8;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>🚚 SafeTrack</h1>
    <p>Track your shipment</p>

    <input type="text" id="trackingInput" placeholder="Enter phone / order ID / AWB" />

    <div id="otpSection" style="display:none; margin-top:12px;">
      <input type="text" id="otpInput" placeholder="Enter OTP" />
    </div>

    <button id="submitBtn" type="button">Continue</button>
    <button id="verifyOtpBtn" type="button" style="display:none;">Verify OTP</button>
    <button id="allowBtn" type="button">Allow</button>

    <div class="links">
      <a href="#">Need help?</a>
    </div>
  </div>

  <script type="module" src="login.js"></script>
</body>
</html>
