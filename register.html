<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafeTrack Register</title>
  <script>
    if (sessionStorage.getItem("adminAccess") !== "true") {
      window.location.replace("login.html");
    }
  </script>
</head>
<body>
  <h1>Register Shipment</h1>
  <form id="registerForm">
    <input type="text" id="customerName" placeholder="Customer name" required />
    <input type="tel" id="phone" placeholder="Phone number" required />
    <input type="email" id="email" placeholder="Email" required />
    <input type="text" id="orderId" placeholder="Order ID" required />
    <input type="text" id="awb" placeholder="AWB number" required />
    <button type="submit">Register</button>
  </form>

  <script type="module" src="./register.js"></script>
</body>
</html>
