<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafeTrack Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1d4ed8);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .login-card {
      width: min(440px, 90vw);
      background: rgba(255,255,255,0.12);
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }
    h1 { margin-top: 0; }
    input {
      width: 100%;
      padding: 12px 14px;
      border: none;
      border-radius: 10px;
      margin: 10px 0;
      font-size: 15px;
    }
    button {
      width: 100%;
      padding: 12px 14px;
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }
    #submitBtn { background: #22c55e; }
    #verifyOtpBtn { background: #2563eb; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>🚚 SafeTrack</h1>
    <p>Track your shipment</p>

    <input type="text" id="trackingInput" placeholder="Enter phone / order ID / AWB" />

    <div id="otpSection" style="display:none; margin-top:12px;">
      <input type="text" id="otpInput" placeholder="Enter OTP" />
    </div>

    <div id="recaptcha-container"></div>

    <button id="submitBtn" type="button">Continue</button>
    <button id="verifyOtpBtn" type="button" style="display:none;">Verify OTP</button>
  </div>

  <script type="module" src="./login.js"></script>
</body>
</html>
