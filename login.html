<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafeTrack Login</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <div class="login-card">
    <h1>🚚 SafeTrack</h1>
    <p>Track your shipment</p>

    <input type="text" id="trackingInput" placeholder="Enter phone / order ID / AWB" />

    <div id="otpSection" style="display:none; margin-top:12px;">
      <input type="text" id="otpInput" placeholder="Enter OTP" />
    </div>

    <button id="submitBtn" type="button">Continue</button>
    <button id="verifyOtpBtn" type="button" style="display:none; margin-top:10px;">
      Verify OTP
    </button>

    <div class="links">
      <a href="#">Need help?</a>
      <a href="register.html">Register</a>
    </div>
  </div>

  <script type="module" src="login.js"></script>
</body>
</html>
